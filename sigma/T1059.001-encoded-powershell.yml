title: Encoded PowerShell Execution
id: b54e39d0-fa3b-454e-9998-bfc6d0b018c0
status: experimental
description: Detects PowerShell execution with flags or function calls commonly used to obfuscate and decode malicious script content.
author: Huy
date: 2026/06/18
references:
    - https://attack.mitre.org/techniques/T1059/001/
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_indicators:
        CommandLine|contains:
            - 'FromBase64String'
            - 'IEX'
            - 'Invoke-Expression'
            - '-enc'
            - '-encodedCommand'
    condition: selection_process and selection_indicators
falsepositives:
    - Legitimate administrative scripts using encoded commands
level: high
tags:
    - attack.execution
    - attack.t1059.001